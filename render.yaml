services:
  - type: web
    name: spotplan
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_EMAIL
        value: demo@spotplan.app
      - key: DEMO_PASSWORD
        sync: false
